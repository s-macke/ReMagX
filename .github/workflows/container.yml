name: Optional container build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - compose.yaml
      - docker/**
      - .dockerignore
      - .github/workflows/container.yml
      - engine/emscripten.version

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build and export with the pinned toolchain
        run: |
          build_log="$RUNNER_TEMP/container-build.log"
          if docker buildx build --progress plain --platform linux/amd64 --file docker/Dockerfile --output type=local,dest=build/container . 2>&1 | tee "$build_log"; then
            exit 0
          fi
          # Only the public allowlisted context enters this build. Bound diagnostic
          # size and escape workflow-command characters as in the numerical jobs.
          python3 - "$build_log" <<'PYTHON'
          import pathlib, sys
          message = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-6000:]
          for index in range(0, len(message), 2000):
              part = message[index:index + 2000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Optional container build failed (part {index // 2000 + 1})::" + part)
          PYTHON
          exit 1
      - name: Check exported artifacts
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          root = Path("build/container")
          required = ["site/index.html", "native/libremagx_core.so",
                      "wasm/remagx-core.wasm", "wasm/remagx-core.mjs", "toolchain.json"]
          missing = [name for name in required if not (root / name).is_file() or not (root / name).stat().st_size]
          if missing:
              inventory = [str(path.relative_to(root)) for path in root.rglob("*")][:100]
              print("::error title=Container artifact layout::Missing " + ", ".join(missing)
                    + "; exported paths: " + ", ".join(inventory))
              raise SystemExit(1)
          PYTHON
      - name: Verify Compose entry point and static export
        run: |
          docker compose config --quiet
          # Reuse the build cache from the Buildx export above.
          docker compose run --rm build
          test -s app/dist/index.html
          test -s app/dist/engine.wasm
          cmp app/dist/engine.wasm app/dist/assets/remagx-core.wasm
          cmp app/dist/engine.wasm build/container/wasm/remagx-core.wasm
          cmp app/dist/index.html build/container/site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: container-build
          path: build/container
          if-no-files-found: error
