# Builds the static web app (app/) and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Runs queued in between are skipped, but an in-progress
# deployment is never cancelled, so it can complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check legacy UI inventory
        run: |
          python3 -m unittest discover -s ../tools/inventory -p 'test_*.py'
          ../tools/inventory/check
          python3 -m unittest discover -s ../tools/golden/legacy -p 'test_*.py'
          python3 -m unittest discover -s ../tools/data -p 'test_*.py'

      - name: Build and test native numerical core
        run: |
          cmake -S ../engine -B ../build/engine -DCMAKE_BUILD_TYPE=Release
          build_log="$RUNNER_TEMP/remagx-native-build.log"
          if ! cmake --build ../build/engine --parallel 2 > "$build_log" 2>&1; then
            python3 - "$build_log" <<'PYTHON'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          errors = [line for line in lines if "error:" in line or "Error" in line]
          message = "\n".join(errors or lines[-30:])[-6000:]
          for index in range(0, len(message), 2000):
              part = message[index:index + 2000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Native build failed (part {index // 2000 + 1})::" + part)
          PYTHON
            exit 1
          fi
          tail -n 8 "$build_log"
          ctest --test-dir ../build/engine --output-on-failure

      - name: Install pinned Emscripten toolchain
        run: |
          sdk_version=$(cat ../engine/emscripten.version)
          sdk_dir="$RUNNER_TEMP/remagx-emsdk"
          git clone --depth 1 --branch "$sdk_version" https://github.com/emscripten-core/emsdk.git "$sdk_dir"
          test "$(git -C "$sdk_dir" rev-parse HEAD)" = 35ff8a6d150541276abbc6bae512ca90bcfbe220
          "$sdk_dir/emsdk" install "$sdk_version"
          "$sdk_dir/emsdk" activate "$sdk_version"

      - name: Configure WebAssembly numerical core
        run: |
          source "$RUNNER_TEMP/remagx-emsdk/emsdk_env.sh"
          emcmake cmake -S ../engine -B ../build/wasm -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build WebAssembly numerical core
        run: |
          source "$RUNNER_TEMP/remagx-emsdk/emsdk_env.sh"
          cmake --build ../build/wasm --parallel 2

      - name: Compare WebAssembly numerical core with native
        run: |
          source "$RUNNER_TEMP/remagx-emsdk/emsdk_env.sh"
          comparison_log="$RUNNER_TEMP/remagx-wasm-comparison.log"
          if WASM_MODULE=../build/wasm/remagx-core.mjs python3 ../engine/tests/test_parratt.py ../build/engine/libremagx_core.so 2>&1 | tee "$comparison_log"; then
            exit 0
          fi
          # Public synthetic fixtures only; never add private-corpus output here.
          python3 - "$comparison_log" <<'PYTHON'
          import pathlib, sys
          message = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-6000:]
          for index in range(0, len(message), 2000):
              part = message[index:index + 2000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Native/WASM comparison failed (part {index // 2000 + 1})::" + part)
          PYTHON
          exit 1

      - run: npm ci

      - name: Verify native and web project schema and JSON round trips
        run: |
          node scripts/export-project-schema.mjs --check
          node scripts/test-native-project.mjs ../build/engine/project_document_tests
          node scripts/test-native-assignments.mjs ../build/engine/legacy_assignment_tests
          node scripts/test-native-terminal.mjs ../build/engine/remagx-terminal ../build/wasm
      - run: npm run lint
      - run: npm test
      - run: npm run test:fit-reference-inputs
      - name: Verify element preparation and qz routing with actual WASM
        run: WASM_MODULE=../build/wasm/remagx-core.mjs npm test -- --run test/elementPreparationWasm.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Lua runtime in Chromium worker
        run: node scripts/test-lua-runtime.mjs
      - name: Verify actual WASM core in Chromium worker
        run: |
          comparison_log="$RUNNER_TEMP/remagx-browser-comparison.log"
          if WASM_BROWSER=1 WASM_MODULE=../build/wasm/remagx-core.mjs python3 ../engine/tests/test_parratt.py ../build/engine/libremagx_core.so 2>&1 | tee "$comparison_log"; then
            exit 0
          fi
          # Public synthetic fixtures only; never add private-corpus output here.
          python3 - "$comparison_log" <<'PYTHON'
          import pathlib, sys
          message = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-6000:]
          for index in range(0, len(message), 2000):
              part = message[index:index + 2000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Chromium WASM comparison failed (part {index // 2000 + 1})::" + part)
          PYTHON
          exit 1
      - name: Verify real engine through ComputeService
        run: |
          comparison_log="$RUNNER_TEMP/remagx-service-comparison.log"
          if node scripts/test-real-service.mjs ../build/wasm 2>&1 | tee "$comparison_log"; then
            exit 0
          fi
          # Public synthetic fixtures only; never add private-corpus output here.
          python3 - "$comparison_log" <<'PYTHON'
          import pathlib, sys
          message = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-6000:]
          for index in range(0, len(message), 2000):
              part = message[index:index + 2000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Real ComputeService failed (part {index // 2000 + 1})::" + part)
          PYTHON
          exit 1
      - name: Verify full UI responsiveness with the real engine
        run: |
          comparison_log="$RUNNER_TEMP/remagx-ui-comparison.log"
          if node scripts/test-real-ui.mjs ../build/wasm 2>&1 | tee "$comparison_log"; then
            exit 0
          fi
          # Public synthetic fixtures only; never add private-corpus output here.
          python3 - "$comparison_log" <<'PYTHON'
          import pathlib, sys
          message = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-6000:]
          for index in range(0, len(message), 2000):
              part = message[index:index + 2000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Real UI failed (part {index // 2000 + 1})::" + part)
          PYTHON
          exit 1
      - run: npm run test:e2e

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
